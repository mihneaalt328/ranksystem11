name: RankSystem
version: 1.0.1
main: me.yourname.ranksystem.RankSystem
author: YourName
description: Complete custom rank and permission system for Spigot 1.8.9

commands:
  rank:
    description: Main RankSystem command
    usage: /rank help
    aliases: [ranks]
  setrank:
    description: Set a player's rank
    usage: /setrank <player> <rank>
  setperms:
    description: Manage rank permissions
    usage: /setperms <rank> <add|remove|list> [permission]

permissions:
  ranksystem.admin:
    description: Access to RankSystem administration commands
    default: op
  ranksystem.bypass:
    description: Bypass rank protection
    default: op
